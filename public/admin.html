<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写日记 · DosDay</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="/">DosDay</a>
      <nav>
        <a href="/">日记</a>
        <a href="#" id="logout-link" class="hidden">退出登录</a>
      </nav>
    </div>
  </header>
  <main class="wrap narrow">
    <div id="login-box" class="card">
      <h2>管理员登录</h2>
      <input type="password" id="password" placeholder="请输入管理密码" autocomplete="current-password" />
      <p id="login-err" class="err"></p>
      <button id="login-btn" class="primary">登录</button>
    </div>

    <div id="editor-box" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="diary">写日记</button>
        <button class="tab" data-tab="schedule">定时邮件</button>
        <button class="tab" data-tab="tasks">任务提醒</button>
      </div>

      <section id="panel-diary" class="panel">
        <h2 id="editor-title-text">写新日记</h2>
        <input type="text" id="title" placeholder="标题（不填自动取内容前12字）" maxlength="100" />
        <textarea id="content" rows="12" placeholder="今天想写点什么…（必填）"></textarea>
        <label class="pin-row"><input type="checkbox" id="pinned" /> 置顶这篇日记</label>
        <label class="pin-row"><input type="checkbox" id="private" checked /> 私密日记（列表模糊遮挡，点开需访问密码）</label>
        <div class="upload-row">
          <label class="upload-btn">+ 添加图片
            <input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" multiple hidden />
          </label>
          <span id="upload-status"></span>
        </div>
        <div id="thumbs" class="thumbs"></div>
        <button id="publish-btn" class="primary">发 表</button>
        <p id="pub-msg" class="err"></p>

        <h3>已发表的日记</h3>
        <div id="manage-list"><div class="loading">加载中…</div></div>
      </section>

      <section id="panel-schedule" class="panel hidden">
        <h2>新建定时邮件</h2>
        <input type="text" id="sc-title" placeholder="邮件标题（可不填）" maxlength="100" />
        <textarea id="sc-content" rows="5" placeholder="邮件内容（必填）"></textarea>
        <div class="form-row">
          <label>重复周期</label>
          <select id="sc-frequency">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
            <option value="yearly">每年</option>
          </select>
          <select id="sc-weekday" class="hidden">
            <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
            <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
            <option value="7">周日</option>
          </select>
          <input type="number" id="sc-monthday" class="hidden" min="1" max="31" placeholder="几号" />
          <select id="sc-month" class="hidden">
            <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
            <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
            <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
          </select>
          <input type="time" id="sc-time" value="08:00" />
        </div>
        <div class="form-row">
          <label>重复周期2</label>
          <select id="sc-frequency2">
            <option value="">不使用</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
            <option value="yearly">每年</option>
          </select>
          <select id="sc-weekday2" class="hidden">
            <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
            <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
            <option value="7">周日</option>
          </select>
          <input type="number" id="sc-monthday2" class="hidden" min="1" max="31" placeholder="几号" />
          <select id="sc-month2" class="hidden">
            <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
            <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
            <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
          </select>
          <input type="time" id="sc-time2" value="20:00" />
        </div>
        <p style="font-size:13px;color:#666;margin:4px 0 8px">重复周期2 选填：两个周期各自独立计时，到点各发一封。</p>
        <button id="sc-create-btn" class="primary">创建定时邮件</button>
        <p id="sc-msg" class="err"></p>
        <h3>已创建的定时邮件</h3>
        <div id="schedule-list"><div class="loading">加载中…</div></div>
      </section>

      <section id="panel-tasks" class="panel hidden">
        <h2 id="tk-form-title">新建任务</h2>
        <input type="text" id="tk-title" placeholder="任务内容（必填，如：进行厨房大清洁）" maxlength="100" />
        <div class="form-row">
          <label>周期天数</label>
          <input type="number" id="tk-cycle" min="1" max="3650" value="28" style="max-width:100px" />
          <label>完成日期</label>
          <input type="date" id="tk-complete" />
        </div>
        <p style="font-size:13px;color:#666;margin:4px 0 8px">下次任务时间：<b id="tk-next-preview"></b></p>
        <div class="form-row">
          <label>提醒时段1</label>
          <input type="time" id="tk-t1" value="08:00" />
          <label>提醒时段2</label>
          <input type="time" id="tk-t2" value="20:00" />
        </div>
        <p style="font-size:13px;color:#666;margin:4px 0 8px">到达或超过下次日期后，每天按填写的提醒时段发邮件；时段2 留空则每天只提醒一次。完成后更新完成日期，下次日期自动顺延。</p>
        <button id="tk-create-btn" class="primary">创建任务</button>
        <button id="tk-cancel-btn" class="hidden">取消编辑</button>
        <p id="tk-msg" class="err"></p>
        <h3>任务列表</h3>
        <div id="tasks-list"><div class="loading">加载中…</div></div>
      </section>
    </div>
  </main>
  <footer class="wrap site-footer">© 2026 DosDay · dosday.dpdns.org</footer>
  <script src="/admin.js"></script>
</body>
</html>
